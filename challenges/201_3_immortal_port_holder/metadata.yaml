id: "201-3"
domain_id: 2
domain: "⚙️ 프로세스 & 시스템 자원"
track_id: "201"
track: "Track 201: 포트 충돌 & 좀비 프로세스 선점"
title: "부모-자식 트리 연쇄 포트 점유 데몬 일괄 소탕"
category: "Process"
difficulty: "Hard"
base_score: 650
target_time_seconds: 600

incident:
  reporter: "SRE Lead"
  severity: "P1-CRITICAL"
  symptom: "8000번 포트를 점유한 자식 프로세스를 kill해도 부모 프로세스가 즉시 새 자식을 fork()하여 포트를 계속 탈환합니다."
  objective: "pstree 또는 ps -ef --forest 로 부모 데몬(immortal_master.py)과 자식 프로세스를 모두 찾아 pkill -9 -f immortal 로 부모까지 일괄 종료하세요."

hints:
  - level: 1
    cost: 50
    text: "자식만 죽이면 부모가 계속 새 프로세스를 띄웁니다. ps -ef | grep immortal 로 부모 PID를 찾으세요."
  - level: 2
    cost: 50
    text: "pkill -9 -f immortal 명령어로 부모와 자식을 동시에 종료하세요."
  - level: 3
    cost: 50
    text: "pkill -9 -f immortal_master && pkill -9 -f immortal_worker"

post_mortem:
  root_cause: "마스터-워커 구조의 프로세스 관리자(Supervisor)가 살아있는 상태에서 워커만 단독 종료하여 자동 재스폰되었습니다."
  key_commands:
    - "ps -ef --forest (프로세스 부모-자식 트리 시각화)"
    - "pkill -9 -f <마스터패턴> (부모 프로세스 우선 사살)"
  real_world_lesson: "Gunicorn/Node PM2/Nginx 등 마스터-워커 구조에서 포트 충돌 시 반드시 마스터 프로세스를 종료해야 합니다."
