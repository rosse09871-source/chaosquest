id: "602-1"
domain_id: 6
domain: "️ 데이터베이스 & 캐시 연동"
track_id: "602"
track: "Track 602: Redis / 캐시 바인딩 & 포트 오류"
title: "Redis 캐시 접속 불가: 127.0.0.1 바인딩 꼬임"
category: "Database"
difficulty: "Easy"
base_score: 500
target_time_seconds: 600

incident:
  reporter: "Backend API Team"
  severity: "P2-HIGH"
  symptom: "API 서버에서 Redis 캐시(6379 포트)로 접속하려 할 때 'Connection refused' 가 발생합니다."
  objective: "/etc/redis/redis.conf 설정 파일에서 bind 127.0.0.1 0.0.0.0 으로 바인딩을 열고 /usr/local/bin/start_redis.sh 를 실행하세요."

hints:
  - level: 1
    cost: 50
    text: "cat /etc/redis/redis.conf 로 Redis가 어느 IP에서 LISTEN하고 있는지 확인하세요."
  - level: 2
    cost: 50
    text: "bind 192.168.254.254 로 존재하지 않는 IP에 묶여있어 데몬이 기동되지 못했습니다."
  - level: 3
    cost: 50
    text: "echo 'bind 0.0.0.0' > /etc/redis/redis.conf 후 /usr/local/bin/start_redis.sh 를 실행하세요."

post_mortem:
  root_cause: "Redis 설정의 bind 주소 오타로 인해 캐시 서비스 소켓이 정상 생성되지 못했습니다."
  key_commands:
    - "cat /etc/redis/redis.conf"
    - "netstat -tlpn | grep 6379"
  real_world_lesson: "Redis, MySQL 등의 인프라 서비스에서 bind-address 설정 오류는 접속 실패의 가장 흔한 원인입니다."
