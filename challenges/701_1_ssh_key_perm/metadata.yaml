id: "701-1"
domain_id: 7
domain: "️ AWS 클라우드 & 인프라 보안"
track_id: "701"
track: "Track 701: SSH 키 권한 & 인증 실패"
title: "SSH 키 권한 오류: Permissions 0644 are too open"
category: "Security"
difficulty: "Easy"
base_score: 500
target_time_seconds: 600

incident:
  reporter: "DevOps Engineer"
  severity: "P2-HIGH"
  symptom: "EC2 인스턴스에 SSH로 접속하려 할 때 'WARNING: UNPROTECTED PRIVATE KEY FILE! Permissions 0644 are too open' 에러가 뜨며 SSH 클라이언트가 접속을 거부합니다."
  objective: "/root/.ssh/id_rsa 개인키 파일의 권한을 chmod 400 또는 600 으로 수정하여 SSH 보안 정책을 만족시키세요."

hints:
  - level: 1
    cost: 50
    text: "SSH 클라이언트는 개인키(id_rsa)가 다른 사용자에게 노출될 위험이 있으면(권한 644, 777 등) 접속을 강제 차단합니다."
  - level: 2
    cost: 50
    text: "chmod 400 /root/.ssh/id_rsa 명령어로 소유자만 읽을 수 있도록 권한을 엄격하게 축소하세요."
  - level: 3
    cost: 50
    text: "chmod 600 또는 chmod 400 /root/.ssh/id_rsa 명령어를 실행하세요."

post_mortem:
  root_cause: "SSH 개인키 파일의 권한이 0644(모든 사용자 읽기 가능)로 설정되어 있어 OpenSSH 클라이언트의 보안 검증에 의해 차단되었습니다."
  key_commands:
    - "chmod 400 ~/.ssh/id_rsa (SSH 개인키 권한 축소)"
    - "chmod 700 ~/.ssh (SSH 디렉터리 권한 설정)"
  real_world_lesson: "AWS EC2 신규 생성 시 pem 키를 다운받아 처음 접속할 때 누구나 한 번쯤 겪는 가장 대표적인 SSH 보안 에러입니다."
