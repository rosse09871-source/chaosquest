id: "502-2"
domain_id: 5
domain: "🐳 도커 & 컨테이너 런타임"
track_id: "502"
track: "Track 502: 컨테이너 환경변수 & 설정 꼬임"
title: "컨테이너 필수 환경변수(DB_HOST) 누락"
category: "Docker"
difficulty: "Medium"
base_score: 550
target_time_seconds: 600

incident:
  reporter: "Cloud Application Team"
  severity: "P1-CRITICAL"
  symptom: "컨테이너 내부 앱이 기동될 때 'FATAL: Required environment variable DB_HOST is missing!' 에러를 뿜으며 즉시 종료됩니다."
  objective: "/etc/environment 파일에 DB_HOST=db.internal.local 환경변수를 등록하여 /usr/local/bin/run_app.sh 스크립트가 성공적으로 실행되도록 조치하세요."

hints:
  - level: 1
    cost: 50
    text: "/usr/local/bin/run_app.sh 스크립트를 열어 어떤 환경변수를 필요로 하는지 확인하세요."
  - level: 2
    cost: 50
    text: "echo 'DB_HOST=db.internal.local' >> /etc/environment 파일에 추가하세요."
  - level: 3
    cost: 50
    text: "export DB_HOST=db.internal.local 후 /usr/local/bin/run_app.sh 를 실행하세요."

post_mortem:
  root_cause: "컨테이너 실행 시 주입되어야 할 필수 환경변수가 .env 또는 시스템 환경변수에서 누락되어 애플리케이션 초기화가 실패했습니다."
  key_commands:
    - "export DB_HOST=..."
    - "cat /etc/environment"
  real_world_lesson: "12-Factor App 원칙에서 환경변수 누락은 컨테이너 배포 실패의 가장 흔한 원인입니다."
