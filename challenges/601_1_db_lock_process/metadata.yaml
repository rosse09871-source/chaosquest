id: "601-1"
domain_id: 6
domain: "🗄️ 데이터베이스 & 캐시 연동"
track_id: "601"
track: "Track 601: DB 파일 락 & 슬로우 쿼리 프로세스"
title: "DB 파일 쓰기 권한 누락: attempt to write a readonly database"
category: "Database"
difficulty: "Easy"
base_score: 500
target_time_seconds: 600

incident:
  reporter: "DB Operator"
  severity: "P2-HIGH"
  symptom: "웹서버가 DB 파일(/var/lib/data/app.db)에 INSERT 시 'attempt to write a readonly database' 에러가 발생합니다."
  objective: "chmod 666 /var/lib/data/app.db 및 chmod 777 /var/lib/data 로 DB 파일 및 상위 디렉터리 쓰기 권한을 부여하세요."

hints:
  - level: 1
    cost: 50
    text: "SQLite는 DB 파일뿐만 아니라 상위 디렉터리(/var/lib/data)에도 락 파일 생성을 위한 쓰기 권한이 필요합니다."
  - level: 2
    cost: 50
    text: "chmod 666 /var/lib/data/app.db && chmod 777 /var/lib/data 명령어를 실행하세요."
  - level: 3
    cost: 50
    text: "chown -R www-data:www-data /var/lib/data && chmod -R 775 /var/lib/data"

post_mortem:
  root_cause: "임베디드 파일 기반 DB(SQLite)의 파일 및 상위 폴더 퍼미션이 읽기 전용(0444)으로 잠겨 있어 쓰기가 차단되었습니다."
  key_commands:
    - "chmod 666 /var/lib/data/app.db"
    - "chmod 777 /var/lib/data"
  real_world_lesson: "파일 기반 DB 사용 시 저널/WAL 파일 생성을 위해 디렉터리 쓰기 권한도 필수입니다."
