id: "203-1"
domain_id: 2
domain: "⚙️ 프로세스 & 시스템 자원"
track_id: "203"
track: "Track 203: CPU 100% 폭주 & 악성 데몬"
title: "서버가 버벅거리는데 범인이 누구지? (위장된 CPU 폭주 데몬)"
category: "Process"
difficulty: "Medium"
base_score: 550
target_time_seconds: 600

incident:
  reporter: "Infrastructure Monitoring Team"
  severity: "P1-CRITICAL"
  symptom: "서버의 CPU 사용량이 100%를 찍고 팬이 굉음을 내며 시스템 응답이 극도로 느려졌습니다. 악성 스크립트가 숨겨져 실행 중인 것으로 의심됩니다."
  objective: "ps aux / top 명령어로 시스템 자원을 비정상적으로 소모하고 있는 위장된 악성 프로세스(/tmp/.hidden_miner.py)를 찾아 강제 종료하세요."

hints:
  - level: 1
    cost: 50
    text: "ps aux --sort=-%cpu 명령어로 CPU 점유율이 가장 높은 프로세스를 확인하세요."
  - level: 2
    cost: 50
    text: "/tmp/.hidden_miner.py 프로세스의 PID를 확인하세요."
  - level: 3
    cost: 50
    text: "kill -9 <PID> 로 종료하고 rm -f /tmp/.hidden_miner.py 로 파일을 삭제하세요."

post_mortem:
  root_cause: "보안 취약점을 통해 유입된 채굴 데몬이 CPU를 100% 점유하고 있었습니다."
  key_commands:
    - "top"
    - "ps aux --sort=-%cpu | head -n 10"
    - "kill -9 <PID>"
  real_world_lesson: "클라우드 서버에서 악성코드 감염 시 가장 흔하게 발생하는 CPU 100% 장애 대응입니다."
