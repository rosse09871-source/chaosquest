id: "103-2"
domain_id: 1
domain: " 파일시스템 & 스토리지"
track_id: "103"
track: "Track 103: 권한 & 소유권 지옥 (403 Forbidden)"
title: "소유 그룹 불일치 및 SGID 누락: www-data 쓰기 거부"
category: "Filesystem"
difficulty: "Medium"
base_score: 550
target_time_seconds: 600

incident:
  reporter: "Web Publishing Team"
  severity: "P2-HIGH"
  symptom: "웹 애플리케이션(www-data)이 /var/www/uploads 디렉터리에 파일을 업로드할 때 Permission Denied 가 발생합니다."
  objective: "/var/www/uploads 디렉터리의 소유 그룹을 www-data 로 변경하고 쓰기 권한(chmod 775 또는 chown -R www-data:www-data)을 부여하세요."

hints:
  - level: 1
    cost: 50
    text: "ls -ld /var/www/uploads 로 디렉터리의 소유자와 소유 그룹을 확인하세요."
  - level: 2
    cost: 50
    text: "소유자가 root:root 로 되어 있어 www-data 가 쓰기를 수행할 수 없습니다."
  - level: 3
    cost: 50
    text: "chown -R www-data:www-data /var/www/uploads && chmod 775 /var/www/uploads"

post_mortem:
  root_cause: "업로드 디렉터리가 root 소유로 생성되어 웹 데몬 권한으로 파일 쓰기가 차단되었습니다."
  key_commands:
    - "chown -R www-data:www-data /var/www/uploads"
    - "chmod 775 /var/www/uploads"
  real_world_lesson: "리눅스 웹서버에서 파일 업로드 경로의 그룹 소유권 누락은 가장 흔한 퍼미션 장애입니다."
