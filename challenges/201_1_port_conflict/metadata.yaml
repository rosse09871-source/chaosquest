id: "201-1"
domain_id: 2
domain: "️ 프로세스 & 시스템 자원"
track_id: "201"
track: "Track 201: 포트 충돌 & 좀비 프로세스 선점"
title: "80번 포트를 빼앗은 범인을 찾아라!"
category: "Process"
difficulty: "Easy"
base_score: 500
target_time_seconds: 600

incident:
  reporter: "Web Delivery Team"
  severity: "P1-CRITICAL"
  symptom: "신규 웹 서비스 배포를 위해 웹서버를 띄우려 했으나 'Address already in use' 에러가 발생하며 기동되지 않습니다."
  objective: "80번 포트를 불법 점유하고 있는 좀비 프로세스를 찾아 종료하고, 웹서버가 80번 포트에서 정상 기동되도록 조치하세요."

hints:
  - level: 1
    cost: 50
    text: "netstat -tlpn 또는 ss -tlpn 또는 lsof -i :80 으로 80번 포트를 열고 있는 프로세스를 확인하세요."
  - level: 2
    cost: 50
    text: "점유하고 있는 rogue_occupier.py 의 PID를 확인하고 kill -9 <PID> 로 종료하세요."
  - level: 3
    cost: 50
    text: "범인 프로세스를 종료한 뒤 /usr/local/bin/start_web.sh 를 실행하여 정상 웹서버를 기동하세요."

post_mortem:
  root_cause: "이전 버전의 백그라운드 프로세스가 제대로 정리되지 않고 남아 특정 포트를 선점하고 있었습니다."
  key_commands:
    - "ss -tlpn 또는 netstat -tlpn (포트 점유 프로세스 추적)"
    - "kill -9 <PID> (프로세스 강제 종료)"
    - "/usr/local/bin/start_web.sh (정상 서비스 기동)"
  real_world_lesson: "배포 시 기존 인스턴스 종료 신호(SIGTERM)를 무시했을 때 발생하는 대표적인 포트 충돌 문제입니다."
