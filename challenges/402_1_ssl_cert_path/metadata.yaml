id: "402-1"
domain_id: 4
domain: " 웹 서버 & 리버스 프록시"
track_id: "402"
track: "Track 402: SSL/TLS 인증서 & HTTPS 설정"
title: "HTTPS 인증서 경로가 꼬였어요!"
category: "Nginx"
difficulty: "Medium"
base_score: 600
target_time_seconds: 600

incident:
  reporter: "Security Operations Center"
  severity: "P1-CRITICAL"
  symptom: "SSL 인증서 갱신 작업 후 Nginx 재기동이 실패하여 HTTPS(443 포트) 서비스가 전면 중단되었습니다."
  objective: "nginx -t 로 Nginx 설정 문법 검사를 실행하여 잘못 지정된 ssl_certificate 파일 경로를 /etc/ssl/certs/valid_app.crt 로 수정하고 HTTPS 서비스를 정상화하세요."

hints:
  - level: 1
    cost: 50
    text: "nginx -t 로 Nginx 설정의 문법 및 파일 경로 에러를 확인하세요."
  - level: 2
    cost: 50
    text: "인증서 파일 경로(/etc/ssl/certs/valid_app.crt, /etc/ssl/private/valid_app.key)가 실제 존재하는지 확인하세요."
  - level: 3
    cost: 50
    text: "/etc/nginx/sites-available/default 의 ssl_certificate 경로를 올바르게 수정한 후 service nginx restart 하세요."

post_mortem:
  root_cause: "SSL 인증서 갱신 후 Nginx 설정 파일에 오타가 포함된 경로가 지정되어 Nginx 프로세스가 기동되지 못했습니다."
  key_commands:
    - "nginx -t"
    - "service nginx restart"
  real_world_lesson: "Nginx 설정을 변경할 때는 반드시 서비스 리로드 전에 nginx -t 로 문법을 사전 검사해야 합니다."
