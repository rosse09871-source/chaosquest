id: "403-1"
domain_id: 4
domain: " 웹 서버 & 리버스 프록시"
track_id: "403"
track: "Track 403: 413 Request Entity Too Large & 버퍼 제한"
title: "대용량 파일 업로드 시 413 에러가 떠요!"
category: "Nginx"
difficulty: "Easy"
base_score: 500
target_time_seconds: 600

incident:
  reporter: "Mobile App Team"
  severity: "P2-HIGH"
  symptom: "사용자들이 5MB 이상의 이미지/동영상을 업로드하면 Nginx에서 '413 Request Entity Too Large' 에러를 반환하며 업로드가 실패합니다."
  objective: "Nginx 설정 파일(/etc/nginx/nginx.conf 또는 /etc/nginx/sites-available/default)에 client_max_body_size 50M; 설정을 추가하여 대용량 업로드를 허용하세요."

hints:
  - level: 1
    cost: 50
    text: "Nginx의 기본 client_max_body_size 는 1MB로 매우 작습니다."
  - level: 2
    cost: 50
    text: "http 또는 server 블록 안에 client_max_body_size 50M; 설정을 추가하세요."
  - level: 3
    cost: 50
    text: "/etc/nginx/sites-available/default 에 client_max_body_size 50M; 을 추가하고 nginx -s reload 하세요."

post_mortem:
  root_cause: "Nginx 기본 요청 본문 크기(1MB) 제한으로 인해 대용량 멀티파트 파일 업로드가 프록시 단계에서 차단되었습니다."
  key_commands:
    - "client_max_body_size 50M; (Nginx 본문 허용 용량 증설)"
    - "nginx -s reload"
  real_world_lesson: "파일 업로드 API 서버 앞단에 Nginx를 둘 때 반드시 client_max_body_size 를 비즈니스 요구사항에 맞게 늘려주어야 합니다."
