id: "401-2"
domain_id: 4
domain: " 웹 서버 & 리버스 프록시"
track_id: "401"
track: "Track 401: Nginx 502 Bad Gateway"
title: "기초 Nginx 데몬 중단: 웹서버 재기동 및 200 OK 복구"
category: "Nginx"
difficulty: "Easy"
base_score: 500
target_time_seconds: 600

incident:
  reporter: "Uptime Monitor"
  severity: "P1-CRITICAL"
  symptom: "80번 포트로 들어오는 모든 웹 요청이 'Connection refused' 로 실패합니다. Nginx 프로세스가 꺼져 있습니다."
  objective: "service nginx start 또는 nginx 명령어로 웹서버를 기동하여 80번 포트 응답을 복구하세요."

hints:
  - level: 1
    cost: 50
    text: "ps aux | grep nginx 로 Nginx 프로세스가 살아있는지 확인하세요."
  - level: 2
    cost: 50
    text: "service nginx status 명령어를 확인하세요."
  - level: 3
    cost: 50
    text: "service nginx start 또는 nginx 명령어로 서비스를 기동하세요."

post_mortem:
  root_cause: "서버 재부팅 후 Nginx 서비스 자동 시작(enable)이 누락되어 데몬이 꺼져 있었습니다."
  key_commands:
    - "service nginx start"
  real_world_lesson: "서비스 설치 후 systemctl enable 설정을 확인하는 것은 서버 셋업의 기본입니다."
