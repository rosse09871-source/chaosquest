track_id: "801"
track: "Track 801: 릴리즈 배포 & 빌드 락"
title: "배포 중 잔류된 Git index.lock 파일 락 해제"
category: "CI/CD"
difficulty: "Easy"
base_score: 500
target_time_seconds: 600
incident:
  reporter: "GitHub Actions Runner"
  severity: "P1-CRITICAL"
  symptom: "이전 배포가 비정상 중단되면서 배포 저장소(/opt/deploy_repo/.git/index.lock)에 파일 락이 남아 신규 릴리즈 배포가 'Another git process is running' 에러로 실패합니다."
  objective: "/opt/deploy_repo/.git/index.lock 잔류 락 파일을 안전하게 제거하세요."
post_mortem:
  root_cause: "배포 파이프라인 타임아웃 종료 시 워커가 index.lock을 삭제하지 못하고 좀비 락으로 남음."
  key_commands:
    - "rm -f /opt/deploy_repo/.git/index.lock"
    - "cd /opt/deploy_repo && git status"
  real_world_lesson: "CI/CD 배포 스크립트 전처리 단계에 trap 시그널 핸들러나 잔류 락 검사 로직을 구성해야 합니다."
