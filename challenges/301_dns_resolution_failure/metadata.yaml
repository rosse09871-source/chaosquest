id: "301"
title: "서버에서 외부 도메인 조회가 안 돼요! (DNS 네임서버 유실)"
category: "Network"
difficulty: "Easy"
base_score: 500
target_time_seconds: 600

incident:
  reporter: "DevOps Engineer"
  severity: "P1-CRITICAL"
  symptom: "서버 내부에서 apt update, curl https://api.github.com 또는 외부 API 호출 시 'Could not resolve host' 에러가 발생하며 모든 네트워크 작업이 중단되었습니다."
  objective: "/etc/resolv.conf 설정 파일을 확인하여 올바른 공용 DNS 네임서버(예: 8.8.8.8 또는 1.1.1.1)를 등록하고 도메인 이름 풀이(DNS Resolution)를 정상화하세요."

hints:
  - level: 1
    cost: 50
    text: "리눅스에서 도메인 이름을 IP로 변환할 때 참조하는 핵심 설정 파일은 /etc/resolv.conf 입니다."
  - level: 2
    cost: 50
    text: "/etc/resolv.conf 파일 내용이 비어있거나 존재하지 않는 가짜 IP로 지정되어 있는지 확인하세요."
  - level: 3
    cost: 50
    text: "echo 'nameserver 8.8.8.8' > /etc/resolv.conf 또는 echo 'nameserver 1.1.1.1' >> /etc/resolv.conf 명령어로 구글/클라우드플레어 DNS를 등록하세요."

post_mortem:
  root_cause: "네트워크 인터페이스 초기화 또는 DHCP 갱신 과정에서 /etc/resolv.conf 의 네임서버 설정이 유실되어 도메인 질의가 실패했습니다."
  key_commands:
    - "cat /etc/resolv.conf (현재 설정된 DNS 네임서버 확인)"
    - "echo 'nameserver 8.8.8.8' > /etc/resolv.conf (구글 공용 DNS 설정)"
    - "getent hosts google.com 또는 nslookup (DNS 해석 동작 검증)"
  real_world_lesson: "클라우드 VPC나 도커 브릿지 네트워크 환경에서 로컬 캐싱 DNS(systemd-resolved) 데몬이 꼬였을 때 자주 발생하는 대표적인 네트워크 장애입니다."
