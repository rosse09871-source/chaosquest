id: "302"
title: "서버는 떠 있는데 통신이 묵묵부답이에요! (방화벽 차단)"
category: "Network"
difficulty: "Medium"
base_score: 550
target_time_seconds: 600

incident:
  reporter: "Client Application Team"
  severity: "P1-CRITICAL"
  symptom: "8080번 포트에서 웹 애플리케이션이 정상 LISTEN 중인데도, 클라이언트 요청 시 타임아웃(Timeout)이 발생하며 패킷이 증발합니다."
  objective: "iptables 방화벽 규칙을 검사하여 8080번 포트로 들어오는 패킷을 무단 DROP(차단)하고 있는 방화벽 룰을 찾아 삭제하세요."

hints:
  - level: 1
    cost: 50
    text: "리눅스 커널 방화벽 상태를 확인하기 위해 iptables -L -n -v 또는 iptables -S 명령어를 실행하세요."
  - level: 2
    cost: 50
    text: "INPUT 체인에 --dport 8080 -j DROP 이라는 차단 규칙이 걸려 있는지 확인하세요."
  - level: 3
    cost: 50
    text: "iptables -D INPUT -p tcp --dport 8080 -j DROP (또는 iptables -F) 명령어로 해당 차단 룰을 제거하세요."

post_mortem:
  root_cause: "보안 점검 스크립트가 잘못된 포트에 차단(DROP) 룰을 적용하여 서비스 인바운드 트래픽이 커널 단계에서 드롭되었습니다."
  key_commands:
    - "iptables -L -n --line-numbers (체인별 방화벽 룰과 번호 조회)"
    - "iptables -D INPUT <룰번호> (특정 방화벽 룰 삭제)"
    - "iptables -F (모든 방화벽 룰 플러시/초기화)"
  real_world_lesson: "클라우드 보안 그룹(Security Group) 외에도 OS 내부 방화벽(iptables/ufw/firewalld)이 2중으로 적용되어 있어 포트 오픈 시 자주 혼란을 겪는 대표적인 포인트입니다."
