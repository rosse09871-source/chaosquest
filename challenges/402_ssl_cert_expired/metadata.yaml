id: "402"
title: "HTTPS 인증서 경로가 꼬였어요! (SSL/TLS 설정 오류)"
category: "Nginx"
difficulty: "Medium"
base_score: 600
target_time_seconds: 600

incident:
  reporter: "Security Operations Center (SOC)"
  severity: "P1-CRITICAL"
  symptom: "SSL 인증서 갱신 작업 후 Nginx 재기동이 실패(BIO_new_file error)하여 HTTPS(443 포트) 서비스가 전면 중단되었습니다."
  objective: "nginx -t 로 Nginx 설정 문법 검사를 실행하여 잘못 지정된 ssl_certificate 파일 경로를 올바른 경로(/etc/ssl/certs/valid_app.crt, /etc/ssl/private/valid_app.key)로 수정하고 HTTPS 서비스를 정상화하세요."

hints:
  - level: 1
    cost: 50
    text: "Nginx 설정의 문법 및 파일 경로 오류를 확인하기 위해 nginx -t 명령어를 실행하세요."
  - level: 2
    cost: 50
    text: "nginx -t 출력에서 /etc/ssl/certs/wrong_nonexistent.crt 파일을 찾을 수 없다는 에러를 확인하세요."
  - level: 3
    cost: 50
    text: "/etc/nginx/sites-available/default 파일에서 ssl_certificate 경로를 /etc/ssl/certs/valid_app.crt 로, ssl_certificate_key 경로를 /etc/ssl/private/valid_app.key 로 수정한 후 service nginx restart 하세요."

post_mortem:
  root_cause: "SSL/TLS 인증서 갱신 후 Nginx 설정 파일에 오타가 포함된 인증서 파일 경로가 지정되어 Nginx 프로세스가 기동되지 못했습니다."
  key_commands:
    - "nginx -t (설정 파일 문법 및 인증서 파일 경로 유효성 사전 검사)"
    - "openssl x509 -in <인증서> -text -noout (인증서 만료일 및 도메인 정보 확인)"
    - "service nginx restart (Nginx 재기동)"
  real_world_lesson: "실무에서 Nginx 설정을 변경할 때는 반드시 서비스 리로드 전에 nginx -t 명령어로 문법과 인증서 경로를 사전 검증(Dry-run)하는 습관이 필수적입니다."
