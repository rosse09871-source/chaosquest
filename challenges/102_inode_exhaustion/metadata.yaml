id: "102"
title: "용량은 많은데 파일 생성이 안 돼요! (Inode 고갈)"
category: "Filesystem"
difficulty: "Medium"
base_score: 550
target_time_seconds: 600

incident:
  reporter: "Backend Dev Team"
  severity: "P1-CRITICAL"
  symptom: "df -h 로 확인하면 디스크 용량이 80% 이상 넉넉한데도, 신규 세션 파일이나 로그를 생성하려 하면 'No space left on device' 에러가 뜹니다."
  objective: "수만 개의 쓰레기 임시 파일로 고갈된 Inode 공간을 찾아 정리하고, 정상적으로 신규 파일이 생성될 수 있도록 복구하세요."

hints:
  - level: 1
    cost: 50
    text: "리눅스는 디스크 용량(Byte) 외에도 파일의 개수를 제한하는 'Inode'라는 메타데이터 공간이 있습니다. df -i 명령어로 Inode 사용량을 확인해 보세요."
  - level: 2
    cost: 50
    text: "어떤 디렉터리에 비정상적으로 많은 파일이 쌓여 있는지 find 명령어로 찾아보세요. (예: find /var/cache -type f | wc -l 또는 du --inodes)"
  - level: 3
    cost: 50
    text: "/var/cache/.session_dumps 디렉터리 안에 수만 개의 유령 세션 파일이 방치되어 있습니다. 해당 디렉터리 내부 파일들을 삭제(rm -rf)하여 Inode를 확보하세요."

post_mortem:
  root_cause: "용량은 0바이트에 가까운 수십만 개의 작은 임시 파일(세션, 캐시, 메일 큐)이 누적되어 파일시스템의 Inode가 100% 소진되었습니다."
  key_commands:
    - "df -i (Inode 사용률 확인)"
    - "find <경로> -type f | wc -l (디렉터리별 파일 개수 집계)"
    - "find /var/cache/.session_dumps -type f -delete 또는 rm -rf (대량 파일 일괄 삭제)"
  real_world_lesson: "PHP/Node 세션 파일 정리 크론탭(Cron)이 멈추거나, 이메일 발송 실패 큐가 쌓일 때 자주 발생하며, 정기적인 삭제 배치(Cronjob/logrotate)가 필수적입니다."
