id: "302-1"
domain_id: 3
domain: "🌐 네트워크 & DNS & 방화벽"
track_id: "302"
track: "Track 302: iptables / ufw 유령 방화벽 차단"
title: "서버는 떠 있는데 통신이 묵묵부답이에요! (방화벽 차단)"
category: "Network"
difficulty: "Medium"
base_score: 550
target_time_seconds: 600

incident:
  reporter: "Client Application Team"
  severity: "P1-CRITICAL"
  symptom: "8080번 포트에서 웹 애플리케이션이 정상 LISTEN 중인데도, 클라이언트 요청 시 타임아웃(Timeout)이 발생하며 패킷이 증발합니다."
  objective: "iptables 방화벽 규칙을 검사하여 8080번 포트로 들어오는 패킷을 무단 DROP(차단)하고 있는 방화벽 룰을 찾아 삭제하세요."

hints:
  - level: 1
    cost: 50
    text: "iptables -L -n -v 또는 iptables -S 로 방화벽 룰을 확인하세요."
  - level: 2
    cost: 50
    text: "INPUT 체인에 --dport 8080 -j DROP 차단 룰이 걸려 있습니다."
  - level: 3
    cost: 50
    text: "iptables -D INPUT -p tcp --dport 8080 -j DROP 또는 iptables -F 로 룰을 삭제하세요."

post_mortem:
  root_cause: "iptables 방화벽의 잘못된 DROP 룰로 인해 인바운드 트래픽이 커널 단계에서 드롭되었습니다."
  key_commands:
    - "iptables -L -n --line-numbers"
    - "iptables -D INPUT <번호>"
    - "iptables -F"
  real_world_lesson: "클라우드 보안 그룹 외에 OS 내부 방화벽(iptables)이 2중으로 차단하고 있을 때 자주 발생하는 장애입니다."
