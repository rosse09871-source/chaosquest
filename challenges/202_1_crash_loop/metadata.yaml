id: "202-1"
domain_id: 2
domain: "️ 프로세스 & 시스템 자원"
track_id: "202"
track: "Track 202: CrashLoop 무한 재시작 & 설정 에러"
title: "서비스가 무한 재시작돼요! (CrashLoop & 설정 오타)"
category: "Process"
difficulty: "Medium"
base_score: 550
target_time_seconds: 600

incident:
  reporter: "SRE On-Call Engineer"
  severity: "P1-CRITICAL"
  symptom: "결제 처리 데몬(payment_service)이 기동되자마자 1초 만에 크래시되어 계속 비정상 종료를 반복하고 있습니다."
  objective: "/var/log/payment_service.log 에러 로그를 확인하여 /etc/chaos_app.conf 설정 파일의 오타를 수정하고 서비스를 정상 기동시키세요."

hints:
  - level: 1
    cost: 50
    text: "tail -n 50 /var/log/payment_service.log 로 에러 스택트레이스를 확인하세요."
  - level: 2
    cost: 50
    text: "/etc/chaos_app.conf 파일의 PORT_NUMBER 설정 값을 확인하세요."
  - level: 3
    cost: 50
    text: "PORT_NUMBER=9000 으로 정수 숫자로 수정한 후 /usr/local/bin/start_payment_service.sh 를 실행하세요."

post_mortem:
  root_cause: "설정 파일에 숫자가 들어가야 할 포트 번호 항목에 오타 문자열이 기재되어 파싱 에러로 크래시되었습니다."
  key_commands:
    - "tail -f /var/log/payment_service.log"
    - "nano /etc/chaos_app.conf"
    - "/usr/local/bin/start_payment_service.sh"
  real_world_lesson: "CrashLoopBackOff의 가장 흔한 원인은 환경변수/설정 파일 문법 에러입니다."
