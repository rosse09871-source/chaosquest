id: "201"
title: "80번 포트를 빼앗은 범인을 찾아라!"
category: "Process"
difficulty: "Easy"
base_score: 500
target_time_seconds: 600

incident:
  reporter: "Web Delivery Team"
  severity: "P1-CRITICAL"
  symptom: "신규 웹 서비스 배포를 위해 웹서버를 띄우려 했으나 'Address already in use' 에러가 발생하며 기동되지 않습니다."
  objective: "80번 포트를 불법 점유하고 있는 좀비 프로세스를 찾아 종료하고, 웹서버가 80번 포트에서 정상 기동되도록 조치하세요."

hints:
  - level: 1
    cost: 50
    text: "현재 시스템의 어떤 프로세스가 80번 포트를 열고(LISTEN) 있는지 확인해 보세요. (예: netstat -tlpn 또는 ss -tlpn 또는 lsof -i :80)"
  - level: 2
    cost: 50
    text: "점유하고 있는 프로세스의 PID와 프로세스 이름을 확인하고 kill 명령어로 해당 프로세스를 종료하세요."
  - level: 3
    cost: 50
    text: "범인 프로세스를 종료한 뒤, 메인 웹서버(/usr/local/bin/start_web.sh)를 다시 실행하여 80번 포트에서 정상 응답하는지 curl로 확인하세요."

post_mortem:
  root_cause: "이전 버전의 백그라운드 프로세스가 제대로 정리(graceful shutdown)되지 않고 고아/좀비 상태로 남아 특정 포트를 선점하고 있었습니다."
  key_commands:
    - "ss -tlpn 또는 netstat -tlpn (열린 포트 및 PID 추적)"
    - "lsof -i :80 (특정 포트 점유 프로세스 식별)"
    - "kill -15 or kill -9 <PID> (프로세스 종료)"
  real_world_lesson: "배포 시 기존 인스턴스 종료 신호(SIGTERM)를 무시하거나 PID 파일 락이 남아있을 때 자주 발생하며, Docker 컨테이너 재배포 시 포트 충돌의 주원인입니다."
