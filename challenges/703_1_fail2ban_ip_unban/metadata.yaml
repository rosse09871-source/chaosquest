id: "703-1"
domain_id: 7
domain: "️ AWS 클라우드 & 인프라 보안"
track_id: "703"
track: "Track 703: Fail2ban 침입 차단 & IP 격리 해제"
title: "사내 개발자 IP가 차단되었어요! (Fail2ban IP Unban)"
category: "Security"
difficulty: "Hard"
base_score: 650
target_time_seconds: 600

incident:
  reporter: "Office Network Administrator"
  severity: "P1-CRITICAL"
  symptom: "사내 공인 IP(203.0.113.50)에서 SSH 비밀번호를 5회 연속 잘못 입력하여 Fail2ban에 의해 IP가 블랙리스트 차단되었습니다."
  objective: "/etc/fail2ban/jail.local 차단 목록(/var/log/fail2ban.blocked)에서 차단된 개발팀 IP(203.0.113.50)를 찾아 차단을 해제(/usr/local/bin/unban_ip.sh 203.0.113.50)하세요."

hints:
  - level: 1
    cost: 50
    text: "cat /var/log/fail2ban.blocked 파일을 확인하여 차단된 IP 목록을 조회하세요."
  - level: 2
    cost: 50
    text: "/usr/local/bin/unban_ip.sh 스크립트에 차단 해제할 IP를 인자로 전달하여 실행하세요."
  - level: 3
    cost: 50
    text: "/usr/local/bin/unban_ip.sh 203.0.113.50 명령어를 실행하세요."

post_mortem:
  root_cause: "Fail2ban 침입 차단 시스템에 의해 비밀번호 오입력 사내 IP가 자동으로 iptables 차단 리스트에 등록되었습니다."
  key_commands:
    - "fail2ban-client status sshd (차단된 IP 현황 조회)"
    - "fail2ban-client set sshd unbanip <IP> (특정 IP 차단 해제)"
  real_world_lesson: "실무 클라우드 서버에서 개발자나 재택근무자가 비밀번호 오입력으로 서버 접속이 막혔을 때 즉각적인 IP Unban 조치 절차입니다."
